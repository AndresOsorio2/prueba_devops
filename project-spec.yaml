# ========================================
# PROJECT SPECIFICATION - Backend
# Deliverable Manager
# ========================================

project:
  name: deliverable-manager-backend
  description: Backend API para gestión de entregables
  version: "1.0.0"
  type: backend

runtime:
  language: node
  version: "20.x"
  packageManager: npm

environment:
  required:
    - name: NODE_ENV
      description: Entorno de ejecución
      defaultValue: development
    - name: PORT
      description: Puerto del servidor
      defaultValue: "3001"
    - name: MONGODB_URI
      description: URI de conexión a MongoDB
      required: true
    - name: UPLOAD_DIR
      description: Directorio de archivos subidos
      defaultValue: "./uploads"
  optional:
    - name: SEQ_SERVER_URL
      description: URL del servidor SEQ para logs
      defaultValue: "http://localhost:5341"
    - name: SEQ_API_KEY
      description: API Key de SEQ
      defaultValue: ""

services:
  - name: mongodb
    type: database
    port: 27017
    required: true
    credentials:
      username: root
      password: "123456"
      database: deliverable_manager
  - name: seq
    type: api
    port: 5341
    required: false
    description: Centralización de logs

dependencies:
  system:
    - name: node
      version: "20.x"
      required: true
    - name: npm
      version: "10.x"
      required: true
  packages:
    - name: express
      version: "^4.18.2"
      required: true
    - name: mongoose
      version: "^7.6.0"
      required: true
    - name: cors
      version: "^2.8.5"
      required: true
    - name: dotenv
      version: "^16.3.1"
      required: true
    - name: joi
      version: "^17.11.0"
      required: true
    - name: multer
      version: "^1.4.5-lts.1"
      required: true
    - name: winston
      version: "^3.11.0"
      required: true
    - name: "@datalust/winston-seq"
      version: "^3.0.1"
      required: false
  devDependencies:
    - name: nodemon
      version: "^3.0.1"
      required: false

structure:
  entryPoint: src/index.js
  srcDir: src
  testDir: tests
  buildDir: null
  configFiles:
    - filename: package.json
      required: true
      description: Configuración de dependencias y scripts
    - filename: .env
      required: true
      description: Variables de entorno
    - filename: .env.local
      required: false
      description: Variables de entorno locales (no commit)
    - filename: .gitignore
      required: true
      description: Archivos ignorados por git
    - filename: Dockerfile
      required: false
      description: Para contenerización
  srcFiles:
    - filename: src/index.js
      description: Punto de entrada del servidor
    - filename: src/config/database.js
      description: Configuración de MongoDB (futuro)
    - filename: src/logger/seqLogger.js
      description: Configuración de logging
    - filename: src/models/Project.js
      description: Modelo de Proyectos
    - filename: src/models/Document.js
      description: Modelo de Documentos/Entregables
    - filename: src/models/Rule.js
      description: Modelo de Reglas (recursivo)
    - filename: src/models/Evidence.js
      description: Modelo de Evidencias
    - filename: src/models/Event.js
      description: Modelo de Eventos (Event Sourcing)
    - filename: src/controllers/projectController.js
      description: Controlador de Proyectos
    - filename: src/routes/projects.js
      description: Rutas de Proyectos
    - filename: src/services/eventSourcingService.js
      description: Servicio de Event Sourcing

checks:
  build:
    command: "echo 'No build required'"
    timeout: 5
    hasBuild: false
  test:
    command: "npm test"
    timeout: 30
    hasTests: true
  lint:
    command: "echo 'No lint configured'"
    hasLint: false

docker:
  hasDockerfile: true
  hasCompose: true
  composePath: ../infra/docker-compose.yml
  services:
    - name: dm-mongodb
      port: 27017
    - name: dm-seq
      port: 5341
    - name: dm-backend
      port: 3001

scripts:
  dev: "nodemon src/index.js"
  build: "echo 'No build required'"
  start: "node src/index.js"
  test: "echo 'No tests configured'"
  lint: "echo 'No lint configured'"
  verify: "./verify.sh"

# Configuración de verificación
verification:
  nodeVersion:
    major: 20
    allowHigher: true
  ports:
    - service: mongodb
      port: 27017
    - service: seq
      port: 5341
    - service: backend
      port: 3001
  envFiles:
    - .env
    - .env.local
  requiredCommands:
    - node
    - npm
