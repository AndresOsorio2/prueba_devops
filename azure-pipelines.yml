# =============================================================================
# CI del backend - Deliverable Manager API
# -----------------------------------------------------------------------------
# Spec:      project-docs/infra/specs/001-azure-devops-ci-pipeline
# Feature:   99 - azure-devops-ci-pipeline
# Decisiones: D-101 (un pipeline por repo), D-102 (Node 22), D-103 (oxlint),
#             D-104 (verify.sh como humo), D-106 (sin secretos en el yml)
#
# ESTADO: definido y versionado, pero NO publicado en Azure DevOps. No se
# cuenta con el ambiente preparado. Ver la seccion "Lo diferido" del final y el
# AC6 del spec.
#
# Estructura (D-101): la raiz del proyecto no es un repositorio git - cada
# subdirectorio lo es, por decision D-066 - asi que este yml vive en el repo que
# valida. Por eso no hay un unico pipeline para backend y frontend, sino uno por
# repositorio de codigo.
# =============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

# CI en la rama de integracion (D-101; la rama `dev` se crea al publicar).
trigger:
  branches:
    include:
      - dev

# Validacion de pull requests hacia `dev`.
pr:
  branches:
    include:
      - dev
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  # D-102: 22.x es la version con la que se ejecuto la suite en desarrollo
  # (baseline 897/897). verify.sh:44 espera v20.x y emite un warning con otra
  # version, pero no rompe el exit code: verify.sh:209-215 decide solo por FAIL,
  # y la comprobacion de version usa check_warn, no check_fail.
  NODE_VERSION: '22.x'

  # D-106 - Punto de enganche de los secretos (feature 100).
  #
  # Cuando exista el Variable Group enlazado a Azure Key Vault, se referenciara
  # aqui y no habra que tocar ningun otro punto del pipeline:
  #
  #   variables:
  #   - group: dm-secrets
  #
  # (JWT_SECRET, MONGODB_URI, CORS_ORIGIN, SEQ_SERVER_URL, SEQ_API_KEY, ...)
  #
  # Este pipeline no necesita ningun secreto: la suite corre contra dobles de
  # prueba y verify.sh no falla por los servicios ausentes en el agente. Por eso
  # no se declara ninguna variable sensible aqui a proposito - un placeholder que
  # sobreviviera a la publicacion se convertiria en un valor por defecto
  # silencioso.
  #
  # D-104 - verify.sh se ejecuta como ultimo paso y NO sustituye a los pasos
  # explicitos de arriba. Se conserva ademas como paso propio porque el pipeline
  # tiene que ser diagnosticable: verify.sh redirige su salida a /dev/null
  # (verify.sh:179), y ademas cubre comprobaciones que los pasos de arriba no
  # hacen (existencia de .env, Dockerfile, src/index.js, y el stack de infra).

stages:
  - stage: CI
    displayName: 'CI backend'
    jobs:
      - job: Backend
        displayName: 'Lint, tests y verify'
        steps:
          - task: NodeTool@0
            displayName: 'Usar Node $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: npm ci
            displayName: 'Instalar dependencias (npm ci)'

          # D-103 / AC3: oxlint sale con exit 0 salvo que se invoque
          # --deny-warnings, y no se invoca a proposito. Los 39 warnings
          # preexistentes del backend estan registrados como H-003 en el spec y
          # se corrigen en su propia feature de deuda tecnica, no bajando la
          # severidad de las reglas para dejar el pipeline en verde.
          - script: npm run lint
            displayName: 'Lint (oxlint)'

          # El JSON nativo de Jest alimenta PublishTestResults@2 con
          # testResultsFormat: 'Jest', sin anadir la dependencia jest-junit.
          # `reports/` esta en .gitignore, asi que el resultado no se versiona.
          - script: npm test -- --json --outputFile=reports/test-results.json
            displayName: 'Tests (Jest) con cobertura'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de test'
            inputs:
              testResultsFormat: 'Jest'
              testResultsFiles: 'reports/test-results.json'
              testRunTitle: 'Backend'
              mergeTestResults: true
              failTaskOnFailedTests: true

          # El backend no tiene paso de build: no hay transpilación ni
          # empaquetado, `main` es src/index.js y se ejecuta con node. Lo que se
          # publica como evidencia de esta etapa es la cobertura.
          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura'
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/coverage-final.json'

          - script: ./verify.sh
            displayName: 'verify.sh (humo)'

# =============================================================================
# Lo diferido hasta que exista el ambiente (AC6 del spec)
# -----------------------------------------------------------------------------
# Ninguno de estos puntos se puede verificar mientras el pipeline no se publique,
# y por eso se listan en vez de darse por cubiertos:
#
#   1. Publicar este pipeline en Azure DevOps (organizacion `andresosorio2`).
#      El repo `backend` ya tiene remote: _git/DeliverableManagerApi, en la rama
#      `feature/auth`.
#   2. Crear la rama `dev`, que hoy no existe en ningun repositorio. Sin ella el
#      `trigger` no dispara nunca.
#   3. Configurar la politica de PR que exija CI en verde para completar el PR.
#      Eso se hace en la interfaz de Azure DevOps, no en este archivo.
#   4. Confirmar que el agente resuelve NodeTool@0 y que tiene permisos para
#      publicar artefactos.
#   5. Enlazar el Variable Group de Key Vault (D-106, feature 100). Ninguna de las
#      variables de este pipeline es secreta.
#
# Nota sobre `dev` (2026-09-30): el repo tiene `master` y `feature/auth`, y el
# pipeline se escribio en `feature/auth`. Si al integrar los repos la rama de
# integracion se llama distinto, hay que ajustar `trigger` y `pr` en los dos yml
# (backend y frontend) a la vez.
# =============================================================================
